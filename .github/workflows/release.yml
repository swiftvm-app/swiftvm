name: Release

on:
  workflow_dispatch:
    inputs:
      from_beta_tag:
        description: "Beta tag to promote to stable (e.g. v0.2.0-beta.42)"
        required: true
        type: string
      version:
        description: "Stable version to release (X.Y.Z)"
        required: true
        type: string
      next_beta_version:
        description: "Version that beta builds should target after this release (X.Y.Z) — written to BETA_VERSION"
        required: true
        type: string
      draft:
        description: "Create the GitHub release as a draft"
        required: false
        default: false
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      next_beta_version: ${{ steps.validate.outputs.next_beta_version }}
      build_number: ${{ steps.validate.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate inputs
        id: validate
        env:
          VERSION: ${{ inputs.version }}
          NEXT: ${{ inputs.next_beta_version }}
          BETA_TAG: ${{ inputs.from_beta_tag }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: version must be in X.Y.Z format"
            exit 1
          fi
          if ! [[ "$NEXT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: next_beta_version must be in X.Y.Z format"
            exit 1
          fi
          if ! [[ "$BETA_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "Error: from_beta_tag must look like vX.Y.Z-beta.N"
            exit 1
          fi
          if ! git rev-parse "$BETA_TAG" >/dev/null 2>&1; then
            echo "Error: tag $BETA_TAG not found"
            exit 1
          fi
          BUILD_NUMBER=$(git rev-list --count "$BETA_TAG")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "next_beta_version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    uses: ./.github/workflows/build-release.yml
    with:
      ref: ${{ inputs.from_beta_tag }}
      version: ${{ needs.validate.outputs.version }}
      build_number: ${{ needs.validate.outputs.build_number }}
      feed_url: https://github.com/swiftvm-app/swiftvm/releases/latest/download/appcast.xml
    secrets: inherit

  release:
    needs: [validate, build]
    runs-on: xcode-27
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: v${{ needs.validate.outputs.version }}
      VERSION: ${{ needs.validate.outputs.version }}
      BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
      BETA_TAG: ${{ inputs.from_beta_tag }}
      DRAFT: ${{ inputs.draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.from_beta_tag }}
          # Pushing the BETA_VERSION bump to a protected main takes a token that is allowed to.
          token: ${{ secrets.GH_RELEASE_PAT || github.token }}

      - name: Resolve Sparkle dependency
        run: swift package resolve

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dmg
          path: artifacts

      - name: Fetch previous stable appcast
        run: |
          mkdir -p prev
          if gh release download --repo "$REPO" --pattern appcast.xml --dir prev; then
            echo "Fetched previous stable appcast"
          else
            echo "No previous stable appcast (first release)"
            rm -f prev/appcast.xml
          fi

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CHANNEL: stable
        run: |
          EXISTING=""
          if [[ -f prev/appcast.xml ]]; then
            EXISTING=prev/appcast.xml
          fi
          EXISTING_APPCAST="$EXISTING" scripts/generate-appcast.sh \
            "artifacts/SwiftVM-${VERSION}.dmg" "$TAG" "$BUILD_NUMBER" appcast.xml

      - name: Create GitHub Release
        run: |
          NOTES=$(gh api \
            --method POST "/repos/$REPO/releases/generate-notes" \
            -f "tag_name=$TAG" \
            -f "target_commitish=$BETA_TAG" \
            --jq .body \
            | scripts/clean-changelog.sh)
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$REPO" \
              --notes "$NOTES" \
              --draft="$DRAFT"
            gh release upload "$TAG" \
              --repo "$REPO" \
              --clobber \
              artifacts/*.dmg \
              appcast.xml
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --target "$(git rev-parse HEAD)" \
              --title "SwiftVM $TAG" \
              --notes "$NOTES" \
              --draft="$DRAFT" \
              artifacts/*.dmg \
              appcast.xml
          fi

      - name: Bump BETA_VERSION
        env:
          NEXT: ${{ needs.validate.outputs.next_beta_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull --rebase origin main
          echo "$NEXT" > BETA_VERSION
          git add BETA_VERSION
          if git diff --cached --quiet; then
            echo "BETA_VERSION already at $NEXT, nothing to commit"
            exit 0
          fi
          git commit -m "Bump BETA_VERSION to $NEXT"
          git push origin main

  update-homebrew-tap:
    needs: [validate, release]
    if: ${{ !inputs.draft }}
    uses: ./.github/workflows/update-homebrew-tap.yml
    with:
      tag: v${{ needs.validate.outputs.version }}
    secrets: inherit
