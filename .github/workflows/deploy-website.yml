name: Deploy Website

# By hand, or as the last step of a stable release. A push to main leaves the site as it is, so the pages
# of docs/ can describe what isn't released yet.
on:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or commit to build the site from"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build the site from. Empty: the one this is run from"
        required: false
        type: string

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # One deployment at a time, in the order they were asked for.
    concurrency:
      group: deploy-website
      cancel-in-progress: false
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.node-version
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Error: the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are not set"
            exit 1
          fi
          npx --yes wrangler@4 deploy
