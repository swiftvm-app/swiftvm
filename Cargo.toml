[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
swiftvm-protocol = { path = "crates/swiftvm-protocol" }
swiftvm-service = { path = "crates/swiftvm-service" }
base64 = "0.22"
libc = "0.2"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
unicode-segmentation = "1"
uuid = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
